[project]
name = "fenecon-modbus"
version = "0.1.0"
description = "Asynchronous Modbus/TCP client for FENECON energy management systems (FEMS)"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Tomson124" }
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pymodbus>=3.10",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[project.urls]
homepage = "https://github.com/Tomson124/fenecon-modbus"
repository = "https://github.com/Tomson124/fenecon-modbus"
documentation = "https://github.com/Tomson124/fenecon-modbus"
"Bug Tracker" = "https://github.com/Tomson124/fenecon-modbus/issues"
Changelog = "https://github.com/Tomson124/fenecon-modbus/releases"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120
